[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyear-orchestrator"
version = "0.1.0"
description = "EYEAR role-based agents and central orchestration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "paho-mqtt>=2.0",
    "openai>=1.40",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["orchestrator*", "dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
